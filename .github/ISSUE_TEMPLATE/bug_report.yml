name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@glorychain/core"
        - "@glorychain/fs"
        - "@glorychain/github"
        - "@glorychain/shared"
        - "glorychain (CLI)"
        - "conformance suite"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `glorychain create ...`
        2. Run `glorychain append ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - OS: macOS 14 / Ubuntu 22.04
        - Node: 20.x
        - glorychain CLI version: 0.0.2
    validations:
      required: true

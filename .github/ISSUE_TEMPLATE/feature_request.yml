name: Feature request
description: Propose a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: Describe the use case or gap this addresses.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: What should the new behaviour look like?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: What else did you consider?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Protocol (core)
        - CLI
        - Connector (fs / github / new)
        - Conformance suite
        - Documentation
        - Other
    validations:
      required: true
